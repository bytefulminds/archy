# GitLab CI for Archy.
#
# lint + test run on every pipeline (Linux). On a version tag (v1.2.3) the
# build and release stages publish the downloads:
#   - build:linux-appimage, build:windows and build:macos build the three
#     installers and upload them to the project's generic package registry.
#     Linux runs on GitLab's shared runners; Windows and macOS on our own
#     group runners (tags: windows / macos, shell executor, see
#     RELEASING.md). On other pipelines each can be started by hand as a test
#     build, kept as a job artifact only.
#   - release waits for all three, then creates the GitLab Release for the
#     tag with the notes from CHANGELOG.md (scripts/release_notes.py) and a
#     download link to each installer. The tag must match __version__, or the
#     build stops.
#
# The test job installs the native libarchive C library (libarchive13;
# libarchive-c only ships the Python binding, and the LibArchiveBackend tests
# need the native lib) plus the system libraries Qt needs to run offscreen
# ($QT_RUNTIME_LIBS: OpenGL/EGL, fontconfig, xkbcommon, D-Bus, audio, and NSS
# and the X extensions QtWebEngine links against), so the UI tests run in CI
# instead of skipping. The image is pinned to Debian bookworm so those package
# names stay valid.

default:
  image: python:3.12-slim-bookworm

stages:
  - lint
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Where the downloads of a release live (generic package registry).
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/archy"
  QT_RUNTIME_LIBS: >-
    libgl1 libegl1 libgbm1 libdrm2 libfontconfig1 libfreetype6 libxkbcommon0
    libglib2.0-0 libdbus-1-3 libasound2 libpulse0 libgssapi-krb5-2
    libnss3 libnspr4 libx11-6 libx11-xcb1 libxcb1 libxext6 libxfixes3 libxrender1
    libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1

cache:
  key: "$CI_JOB_NAME_SLUG"         # "build-windows": a ":" is not allowed in a Windows path
  paths:
    - .cache/pip

lint:
  stage: lint
  script:
    # The ruff version of the lock, so lint here agrees with lint at home.
    - pip install "ruff==$(sed -n 's/^ruff==\([^ ]*\).*/\1/p' requirements/lock.txt)"
    - ruff check .
    - ruff format --check .

test:
  stage: test
  script:
    - apt-get update && apt-get install -y --no-install-recommends libarchive13 $QT_RUNTIME_LIBS
    - pip install --require-hashes -r requirements/lock.txt
    - pip install --no-deps --no-build-isolation -e .
    - QT_QPA_PLATFORM=offscreen pytest

# --- packaging -------------------------------------------------------------

build:linux-appimage:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - when: manual               # otherwise: a test build, started by hand
      allow_failure: true
  script:
    # Runtime libs the bundled app needs (PyInstaller bundles what Qt links
    # against from the build host), libxcb-cursor0 (bundled into the AppImage
    # for the Qt xcb platform plugin), binutils (PyInstaller needs objdump),
    # curl (fetches appimagetool, uploads the result) and file.
    - apt-get update && apt-get install -y --no-install-recommends
        libarchive13 $QT_RUNTIME_LIBS libxcb-cursor0 binutils curl file desktop-file-utils
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Stops here when the tag and __version__ disagree.
        python scripts/release_notes.py "$CI_COMMIT_TAG" > release_notes.md
      fi
      # The version without the "v", for the release job's file names.
      echo "VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/archy/__init__.py)" > release.env
    - pip install --require-hashes -r requirements/lock.txt
    - pip install --no-deps --no-build-isolation -e .
    - chmod +x packaging/build_appimage.sh
    - ./packaging/build_appimage.sh
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        . ./release.env
        FILE="Archy-${VERSION}-linux-x86_64.AppImage"
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "dist/$FILE" "$PACKAGE_URL/$VERSION/$FILE"
      fi
  artifacts:
    name: "Archy-AppImage"
    paths:
      - dist/*.AppImage
      - release_notes.md
    reports:
      dotenv: release.env        # VERSION, for the release job
    expire_in: 7 days            # the release download lives in the package registry

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build:linux-appimage
      artifacts: true
    - job: build:windows
      artifacts: false
    - job: build:macos
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Archy ${VERSION}"
    description: ./release_notes.md
    assets:
      links:
        - name: "Archy-${VERSION}-setup.exe"
          url: "${PACKAGE_URL}/${VERSION}/Archy-${VERSION}-setup.exe"
          link_type: package
        - name: "Archy-${VERSION}-macos-arm64.dmg"
          url: "${PACKAGE_URL}/${VERSION}/Archy-${VERSION}-macos-arm64.dmg"
          link_type: package
        - name: "Archy-${VERSION}-linux-x86_64.AppImage"
          url: "${PACKAGE_URL}/${VERSION}/Archy-${VERSION}-linux-x86_64.AppImage"
          link_type: package

# The Windows and macOS builds run the same one-command build as on a PC or
# Mac (see RELEASING.md) on our own group runners, shell executor. The venv
# and pip's cache are kept on the machine between builds (GIT_CLEAN_FLAGS), so
# only changed packages install; GitLab's cache (a zip up and down) is not used.
# On a tag the installer is uploaded with the job token; the file name carries
# __version__, so a tag that does not match it finds no file and stops.

build:windows:
  stage: build
  tags:
    - windows                    # our Windows runner (PowerShell)
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - when: manual               # otherwise: a test build, started by hand
      allow_failure: true
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e .venv/ -e .cache/
  cache: []
  script:
    - powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
    - |
      if ($env:CI_COMMIT_TAG) {
        $version = $env:CI_COMMIT_TAG.Substring(1)
        $file = "Archy-$version-setup.exe"
        curl.exe --fail --show-error --silent --header "JOB-TOKEN: $env:CI_JOB_TOKEN" `
          --upload-file "packaging\windows\Output\$file" "$env:PACKAGE_URL/$version/$file"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
  artifacts:
    name: "Archy-windows"
    paths:
      - packaging/windows/Output/*.exe
    expire_in: 7 days            # the release download lives in the package registry

build:macos:
  stage: build
  tags:
    - macos                      # our macOS runner (Apple Silicon)
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - when: manual               # otherwise: a test build, started by hand
      allow_failure: true
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e .venv/ -e .cache/
  cache: []
  script:
    # A runner started by launchd does not have Homebrew on its PATH.
    - eval "$(/opt/homebrew/bin/brew shellenv)"
    - bash packaging/macos/build_dmg.sh
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        FILE="Archy-${VERSION}-macos-$(uname -m).dmg"
        curl --fail --show-error --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "dist/$FILE" "$PACKAGE_URL/$VERSION/$FILE"
      fi
  artifacts:
    name: "Archy-macos"
    paths:
      - dist/*.dmg
    expire_in: 7 days            # the release download lives in the package registry
