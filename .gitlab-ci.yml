# GitLab CI for Archy.
#
# lint + test run on every pipeline (Linux). On a version tag (v1.2.3) the
# build and release stages publish the downloads:
#   - build:linux-appimage builds the portable AppImage and uploads it to the
#     project's generic package registry (on other pipelines it can be started
#     by hand, as a test build, and is kept as a job artifact only).
#   - release creates the GitLab Release for the tag, with the notes from
#     CHANGELOG.md (scripts/release_notes.py) and a download link to the
#     AppImage. The tag must match __version__, or the build stops.
#   - Windows and macOS have no runners: those installers are built on a PC /
#     Mac and added to the same release (see RELEASING.md). build:windows /
#     build:macos stay here for when such runners exist (tags: windows /
#     macos); until then they never start and never block a pipeline.
#
# The test job installs the native libarchive C library (libarchive13;
# libarchive-c only ships the Python binding, and the LibArchiveBackend tests
# need the native lib) plus the system libraries Qt needs to run offscreen
# ($QT_RUNTIME_LIBS: OpenGL/EGL, fontconfig, xkbcommon, D-Bus, audio, and NSS
# and the X extensions QtWebEngine links against), so the UI tests run in CI
# instead of skipping. The image is pinned to Debian bookworm so those package
# names stay valid.

default:
  image: python:3.12-slim-bookworm

stages:
  - lint
  - test
  - build
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Where the downloads of a release live (generic package registry).
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/archy"
  QT_RUNTIME_LIBS: >-
    libgl1 libegl1 libgbm1 libdrm2 libfontconfig1 libfreetype6 libxkbcommon0
    libglib2.0-0 libdbus-1-3 libasound2 libpulse0 libgssapi-krb5-2
    libnss3 libnspr4 libx11-6 libx11-xcb1 libxcb1 libxext6 libxfixes3 libxrender1
    libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip

lint:
  stage: lint
  script:
    - pip install ruff
    - ruff check .
    - ruff format --check .

test:
  stage: test
  script:
    - apt-get update && apt-get install -y --no-install-recommends libarchive13 $QT_RUNTIME_LIBS
    - pip install -e ".[dev]"
    - QT_QPA_PLATFORM=offscreen pytest

# --- packaging -------------------------------------------------------------

build:linux-appimage:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - when: manual               # otherwise: a test build, started by hand
      allow_failure: true
  script:
    # Runtime libs the bundled app needs (PyInstaller bundles what Qt links
    # against from the build host), libxcb-cursor0 (bundled into the AppImage
    # for the Qt xcb platform plugin), binutils (PyInstaller needs objdump),
    # curl (fetches appimagetool, uploads the result) and file.
    - apt-get update && apt-get install -y --no-install-recommends
        libarchive13 $QT_RUNTIME_LIBS libxcb-cursor0 binutils curl file desktop-file-utils
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Stops here when the tag and __version__ disagree.
        python scripts/release_notes.py "$CI_COMMIT_TAG" > release_notes.md
      fi
      # The version without the "v", for the release job's file names.
      echo "VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/archy/__init__.py)" > release.env
    - pip install -e ".[dev]" pyinstaller
    - chmod +x packaging/build_appimage.sh
    - ./packaging/build_appimage.sh
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        . ./release.env
        FILE="Archy-${VERSION}-linux-x86_64.AppImage"
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "dist/$FILE" "$PACKAGE_URL/$VERSION/$FILE"
      fi
  artifacts:
    name: "Archy-AppImage"
    paths:
      - dist/*.AppImage
      - release_notes.md
    reports:
      dotenv: release.env        # VERSION, for the release job
    expire_in: 7 days            # the release download lives in the package registry

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: build:linux-appimage
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - echo "Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Archy ${VERSION}"
    description: ./release_notes.md
    assets:
      links:
        - name: "Archy-${VERSION}-linux-x86_64.AppImage"
          url: "${PACKAGE_URL}/${VERSION}/Archy-${VERSION}-linux-x86_64.AppImage"
          link_type: package

build:windows:
  stage: build
  tags:
    - windows                    # needs a Windows runner (shell executor)
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  script:
    - pip install -e ".[dev]" pyinstaller
    - pyinstaller packaging\archy.spec --noconfirm
    # No native lib needed (zip/7z/tar are pure Python). Optional: drop
    # libarchive.dll into dist\Archy\ here to add rar/exotic support.
    # Build the installer once Inno Setup is on the runner:
    # - ISCC packaging\windows\archy.iss
  artifacts:
    name: "Archy-windows"
    paths:
      - packaging/windows/Output/*.exe
    expire_in: 30 days

build:macos:
  stage: build
  tags:
    - macos                      # needs a macOS runner
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  script:
    - pip install -e ".[dev]" pyinstaller
    - brew install libarchive || true
    - chmod +x packaging/macos/build_dmg.sh
    - ./packaging/macos/build_dmg.sh
  artifacts:
    name: "Archy-macos"
    paths:
      - dist/*.dmg
    expire_in: 30 days
